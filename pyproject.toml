[project]
name = "oracle-bot"
version = "0.1.0"
description = "Scripted bot for Zelda: Oracle of Ages with deterministic replays and portable checkpoints"
requires-python = ">=3.12"
dependencies = [
    "pyboy==2.8.1",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
llm = ["anthropic"]

[project.scripts]
obot = "oracle_bot.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle_bot", "route"]
